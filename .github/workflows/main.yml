name: Generate Profile Summary Cards

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-profile-summary-cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          github_user: Prasanthmax
          plugin: gtrophy, stats, langs, activity
          plugin_gtrophy_no_frame: true
          plugin_gtrophy_no_bg: true
          plugin_gtrophy_theme: algolia
          plugin_activity_days: 61
